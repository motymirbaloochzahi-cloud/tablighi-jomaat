<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121a16">
    <link rel="manifest" href="manifest.webmanifest">
    <title>تبلیغ جماعت</title>
    <style>
        /* تعریف رنگ‌های تم تاریک بر اساس عکس‌های شما */
        :root {
            --bg: #121a16;
            --card: #1b2620;
            --tx: #e8efe9;
            --mu: #98a89f;
            --ac: #5fc79b;
            --ac2: #1e3a2e;
            --wa: #f0b26b;
            --wa2: #3a2a14;
            --bd: #2b3a32;
        }
        
        * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--tx); padding: 16px; }
        main { max-width: 640px; margin: 0 auto; }
        
        h1 { font-size: 22px; margin-bottom: 4px; }
        h2 { font-size: 18px; margin: 0 0 12px 0; text-align: center; color: var(--ac); }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        
        /* دکمه‌ها */
        button { font: inherit; border: 0; border-radius: 12px; padding: 12px; background: var(--ac2); color: var(--ac); cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.96); }
        .btn-primary { background: var(--ac); color: var(--bg); font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-danger { background: var(--wa2); color: var(--wa); width: 100%; margin-top: 10px; }
        
        /* منوی اصلی (شبیه عکس) */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .tile { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 16px; text-align: center; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--tx); }
        .tile img { width: 40px; height: 40px; object-fit: contain; }
        .tile b { font-size: 32px; line-height: 1; } /* اگر از ایموجی استفاده کردیم */
        
        /* آداب (شبیه عکس) */
        .adab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .adab-tile { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .adab-tile b { font-size: 28px; }
        .adab-text { text-align: right; line-height: 2.2; font-size: 16px; color: var(--tx); }
        .adab-text .ar { font-family: 'Amiri', serif; font-size: 22px; color: var(--ac); margin: 10px 0; display: block; border-right: 3px solid var(--ac); padding-right: 10px; }

        /* ====== استایل‌های قطب‌نما ====== */
        .compass-wrapper { position: relative; width: 300px; height: 300px; margin: 20px auto; }
        .compass-disc { position: absolute; top: 40px; left: 40px; right: 40px; bottom: 40px; border-radius: 50%; border: 3px solid var(--ac); background: var(--card); box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
        .letters-group { position: absolute; inset: -40px; transition: transform 0.1s linear; border-radius: 50%; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: var(--tx); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
        .dashed-line { position: absolute; top: 50%; left: 50%; width: 110px; height: 4px; background-image: linear-gradient(to right, var(--ac) 50%, transparent 50%); background-size: 10px 4px; background-repeat: repeat-x; transform-origin: left center; margin-top: -2px; z-index: 2; transition: transform 0.1s linear; }
        .kaba-icon { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin-top: -22px; margin-left: 88px; background: var(--bg); border: 2px solid var(--ac); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 4; transform-origin: -88px center; transition: transform 0.1s linear; }
        .dir-letter { position: absolute; font-size: 22px; font-weight: bold; color: var(--tx); width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; z-index: 3; }
        .letter-n { top: 0px; left: 50%; transform: translateX(-50%); color: var(--wa); }
        .letter-s { bottom: 0px; left: 50%; transform: translateX(-50%); }
        .letter-e { right: 0px; top: 50%; transform: translateY(-50%); }
        .letter-w { left: 0px; top: 50%; transform: translateY(-50%); }
        .status-box { background: var(--ac2); color: var(--ac); padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 14px; text-align: center; }

        /* ====== استایل‌های تسبیح ====== */
        .tasbih-targets { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .tasbih-targets button { flex: 1; white-space: nowrap; padding: 8px; font-size: 14px; }
        .tasbih-targets button.active { background: var(--ac); color: var(--bg); }
        
        .beads-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
        .bead { width: 20px; height: 20px; border-radius: 50%; background: var(--ac2); border: 1px solid var(--bd); transition: background 0.2s; }
        .bead.active { background: var(--ac); box-shadow: 0 0 8px var(--ac); }
        
        .tasbih-clicker { font-size: 64px; font-weight: bold; text-align: center; padding: 30px; background: var(--card); border: 2px dashed var(--ac); border-radius: 50%; width: 200px; height: 200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .tasbih-clicker:active { transform: scale(0.95); }

        /* استایل قرآن */
        .quran-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); color: var(--tx); margin-bottom: 15px; font-family: inherit; font-size: 16px; }
        .ayah-box { border-bottom: 1px dashed var(--bd); padding-bottom: 16px; margin-bottom: 16px; }
        .ayah-number { background: var(--ac2); color: var(--ac); border-radius: 50%; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .ayah-arabic { font-family: 'Amiri', serif; font-size: 26px; text-align: center; line-height: 2; margin-bottom: 12px; color: var(--tx); }
        .ayah-farsi { font-size: 15px; color: var(--mu); text-align: center; line-height: 1.8; }
        .bismillah { text-align: center; font-family: 'Amiri', serif; font-size: 28px; color: var(--ac); margin-bottom: 20px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <main>
        <!-- هدر -->
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>تبلیغ جماعت</h1>
            <button onclick="back()" style="padding:8px 12px; font-size:14px;">منو ☰</button>
        </div>
        <p style="color:var(--mu); margin-bottom: 24px; font-size:14px;">هماهنگی گروه‌های خروج</p>

        <!-- منوی اصلی -->
        <div id="main-menu">
            <div class="grid-menu">
                <!-- در اینجا می‌توانید تگ img را با آیکون‌های خودتان جایگزین کنید -->
                <div class="tile" onclick="show('qibla')"><b>🧭</b> قبله و اوقات</div>
                <div class="tile" onclick="show('tasbih')"><b>📿</b> تسبیح‌شمار</div>
                <div class="tile" onclick="show('quran')"><b>📖</b> قرآن کریم</div>
                <div class="tile" onclick="show('adab')"><b>📚</b> آداب و اذکار</div>
            </div>
            <!-- بخش آداب در منوی اصلی -->
            <div class="card" style="margin-top: 16px;">
                <h2>📖 آداب و دستورات</h2>
                <div class="adab-grid" id="main-adab-grid"></div>
            </div>
        </div>

        <!-- محتوا -->
        <div id="content"></div>
    </main>

    <script>
        // --- داده‌های آداب ---
        const ADAB_DATA = [
            { title: "آداب وضو", icon: "💧", items: ["نیت وضو را به دل بگیرید و «بسم الله» بگویید.", "دو دست را تا مچ بشویید و مسواک بزنید.", "سه بار مضمضه (آب در دهان) و استنشاق (آب در بینی) انجام دهید.", "صورت را بشویید: از جای رویش موی سر تا زیر چانه و از این گوش تا آن گوش (فرض).", "دست‌ها را تا آرنج، همراه با خود آرنج بشویید (فرض)؛ ابتدا دست راست.", "سر را مسح کنید (مقدار فرض یک‌چهارم سر است؛ مسح تمام سر سنت است) و گوش‌ها را مسح کنید.", "پاها را تا مچ، همراه با برآمدگی مچ بشویید (فرض)؛ ابتدا پای راست.", "در مصرف آب اسراف نکنید، حتی کنار آب جاری."] },
            { title: "آداب غسل", icon: "🚿", items: ["غسل پس از جنابت واجب است و برای بانوان پس از پایان حیض و نفاس.", "نیت را به دل بگیرید و «بسم الله» بگویید.", "ابتدا دو دست را تا مچ بشویید و جاهای نجاست را پاک کنید.", "وضو بگیرید.", "سه بار آب بر سر بریزید و مطمئن شوید به ریشه موها رسیده است.", "سپس شانه راست و بعد شانه چپ را بشویید.", "سه فرض غسل (حنفی): مضمضه، استنشاق و شستن تمام بدن."] },
            { title: "آداب نماز", icon: "🤲", items: ["پیش از اذان آماده شوید: وضو، لباس پاک.", "با آرامش به مسجد بروید.", "صف‌ها را مستقیم و فشرده ببندید.", "با خشوع و حضور قلب نماز بخوانید.", "پس از سلام، سه بار استغفار کنید و تسبیحات را بگویید."] },
            { title: "آداب مسجد", icon: "🕌", items: ["با پای راست وارد شوید و بگویید: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "با پای چپ خارج شوید.", "صدا را پایین بیاورید.", "مسجد را پاکیزه نگه دارید."] },
            { title: "آداب غذا", icon: "🍽", items: ["دست‌ها را بشویید و «بسم الله» بگویید.", "با دست راست و از جلوی خود بخورید.", "لقمه کوچک بگیرید و خوب بجوید.", "کم بخورید و اسراف نکنید."] },
            { title: "آداب خواب", icon: "🌙", items: ["با وضو و پس از مسواک بخوابید.", "روی پهلوی راست بخوابید.", "آیةالکرسی و سه سوره اخلاص، فلق و ناس را بخوانید.", "سبحان‌الله ۳۳، الحمدلله ۳۳ و الله‌اکبر ۳۴ بار بگویید."] }
        ];

        // لیست کامل سوره‌ها
        const SURAHS = [
            { id: 1, name: "الفاتحة" }, { id: 2, name: "البقرة" }, { id: 3, name: "آل عمران" }, { id: 4, name: "النساء" }, { id: 5, name: "المائدة" },
            { id: 6, name: "الأنعام" }, { id: 7, name: "الأعراف" }, { id: 8, name: "الأنفال" }, { id: 9, name: "التوبة" }, { id: 10, name: "يونس" },
            { id: 11, name: "هود" }, { id: 12, name: "يوسف" }, { id: 13, name: "الرعد" }, { id: 14, name: "إبراهيم" }, { id: 15, name: "الحجر" },
            { id: 16, name: "النحل" }, { id: 17, name: "الإسراء" }, { id: 18, name: "الكهف" }, { id: 19, name: "مريم" }, { id: 20, name: "طه" },
            { id: 36, name: "يس" }, { id: 55, name: "الرحمن" }, { id: 67, name: "الملك" }, { id: 112, name: "الإخلاص" }, { id: 113, name: "الفلق" }, { id: 114, name: "الناس" }
            // برای اینکه کد سنگین نشه، بقیه سوره‌ها رو اینجا نیاوردم، در صورت نیاز می‌تونیم بعدا اضافه کنیم
        ];

        // ساخت منوی آداب در صفحه اصلی
        window.onload = function() {
            const grid = document.getElementById('main-adab-grid');
            ADAB_DATA.slice(0, 6).forEach((item, index) => {
                grid.innerHTML += `<div class="adab-tile" onclick="showAdabDetail(${index})"><b>${item.icon}</b> ${item.title}</div>`;
            });
        };

        function show(page) {
            const content = document.getElementById('content');
            document.getElementById('main-menu').classList.add('hidden');

            if (page === 'qibla') {
                content.innerHTML = `
                    <div class="card">
                        <h2>🧭 قبله‌نما</h2>
                        <div class="compass-wrapper">
                            <div class="compass-disc">
                                <div id="letters-group" class="letters-group">
                                    <div class="dir-letter letter-n">N</div>
                                    <div class="dir-letter letter-s">S</div>
                                    <div class="dir-letter letter-e">E</div>
                                    <div class="dir-letter letter-w">W</div>
                                </div>
                                <div id="dashed-line" class="dashed-line"></div>
                                <div id="kaba-icon" class="kaba-icon">🕋</div>
                                <div class="center-dot"></div>
                            </div>
                        </div>
                        <div id="status-box" class="status-box">در حال آماده‌سازی...</div>
                        <button class="btn-primary" onclick="startCompass()">شروع / کالیبراسیون</button>
                        <button class="btn-danger" onclick="stopCompass(); back()">توقف و بازگشت</button>
                    </div>
                `;
            } 
            else if (page === 'tasbih') {
                content.innerHTML = `
                    <div class="card">
                        <h2>📿 تسبیح‌شمار</h2>
                        <div class="tasbih-targets">
                            <button onclick="setTarget(33)" class="active" id="t-33">۳۳</button>
                            <button onclick="setTarget(99)" id="t-99">۹۹</button>
                            <button onclick="setTarget(100)" id="t-100">۱۰۰</button>
                            <button onclick="setTarget(1000)" id="t-1000">۱۰۰۰</button>
                            <button onclick="setTarget(0)" id="t-0">∞</button>
                        </div>
                        
                        <div class="beads-container" id="beads"></div>
                        
                        <div class="tasbih-clicker" onclick="incrementTasbih()">
                            <div id="count" style="color: var(--ac);">0</div>
                            <div style="font-size: 16px; color: var(--mu); font-weight: normal;">هدف: <span id="target-label">۳۳</span></div>
                        </div>
                        
                        <button class="btn-danger" style="margin-top: 20px;" onclick="resetTasbih()">صفر کردن</button>
                        <button class="btn-primary" onclick="back()">بازگشت</button>
                    </div>
                `;
                initTasbih();
            } 
            else if (page === 'adab') {
                let html = `<div class="card"><h2>📖 آداب و اذکار</h2><div class="adab-grid">`;
                ADAB_DATA.forEach((item, index) => {
                    html += `<div class="adab-tile" onclick="showAdabDetail(${index})"><b>${item.icon}</b> ${item.title}</div>`;
                });
                html += `</div><button class="btn-danger" style="margin-top:16px;" onclick="back()">بازگشت</button></div>`;
                content.innerHTML = html;
            } 
            else if (page === 'quran') {
                let options = SURAHS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                content.innerHTML = `
                    <div class="card">
                        <h2>📚 قرآن کریم</h2>
                        <select id="surah-select" class="quran-select" onchange="loadSurah(this.value)">
                            <option value="">-- انتخاب سوره --</option>${options}
                        </select>
                        <div id="quran-content"></div>
                        <button class="btn-danger" style="margin-top:16px;" onclick="back()">بازگشت</button>
                    </div>`;
            }
        }

        function showAdabDetail(index) {
            const item = ADAB_DATA[index];
            let html = `<div class="card">
                <h2>${item.icon} ${item.title}</h2>
                <div class="adab-text">`;
            item.items.forEach(txt => {
                if (txt.includes('اللَّه')) {
                    html += `<div class="ar">${txt}</div>`;
                } else {
                    html += `<p>${txt}</p>`;
                }
            });
            html += `</div>
                <button class="btn-danger" style="margin-top:16px;" onclick="show('adab')">بازگشت به لیست</button>
                <button class="btn-primary" onclick="back()">منوی اصلی</button>
            </div>`;
            document.getElementById('content').innerHTML = html;
        }

        function back() { 
            document.getElementById('content').innerHTML = ''; 
            document.getElementById('main-menu').classList.remove('hidden'); 
        }

        // ==================== منطق تسبیح ====================
        let count = 0;
        let target = 33;
        
        function initTasbih() {
            count = 0;
            document.getElementById('count').innerText = count;
            renderBeads();
        }

        function setTarget(val) {
            target = val;
            document.querySelectorAll('.tasbih-targets button').forEach(b => b.classList.remove('active'));
            document.getElementById(`t-${val}`).classList.add('active');
            document.getElementById('target-label').innerText = val === 0 ? '∞' : val;
            count = 0;
            document.getElementById('count').innerText = count;
            renderBeads();
        }

        function renderBeads() {
            const container = document.getElementById('beads');
            container.innerHTML = '';
            let displayCount = target > 33 || target === 0 ? 33 : target;
            
            for (let i = 0; i < displayCount; i++) {
                let activeClass = "";
                if (target > 33 || target === 0) {
                    // برای اهداف بزرگتر، دانه‌ها رو به صورت درصدی پر می‌کنیم
                    if (i < (count / target) * displayCount) activeClass = "active";
                } else {
                    if (i < count) activeClass = "active";
                }
                container.innerHTML += `<div class="bead ${activeClass}"></div>`;
            }
        }

        function incrementTasbih() {
            count++;
            if (target > 0 && count > target) count = 1; // چرخش مجدد
            document.getElementById('count').innerText = count;
            renderBeads();
            
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function resetTasbih() {
            count = 0;
            document.getElementById('count').innerText = count;
            renderBeads();
        }

        // ==================== منطق قطب‌نما ====================
        let qiblaAngle = 0; 
        let currentHeading = 0;
        let calibrationOffset = 0;
        let compassActive = false;

        function calculateQibla(lat, lng) {
            const K_LAT = 21.4225, K_LNG = 39.8262;
            const phi1 = lat * Math.PI / 180, phi2 = K_LAT * Math.PI / 180;
            const deltaLambda = (K_LNG - lng) * Math.PI / 180;
            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function startCompass() {
            const status = document.getElementById('status-box');
            status.innerText = "در حال دریافت موقعیت...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        qiblaAngle = calculateQibla(pos.coords.latitude, pos.coords.longitude);
                        status.innerText = `زاویه قبله: ${Math.round(qiblaAngle)}°`;
                        initDeviceOrientation();
                    },
                    (err) => {
                        status.innerText = "خطا در دریافت موقعیت. GPS را روشن کنید.";
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function initDeviceOrientation() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permission => {
                    if (permission === 'granted') setupOrientationListener();
                });
            } else {
                setupOrientationListener();
            }
        }

        function setupOrientationListener() {
            if (compassActive) return;
            window.addEventListener('deviceorientationabsolute', handleOrientation);
            window.addEventListener('deviceorientation', handleOrientation);
            compassActive = true;
            
            const calBtn = document.createElement('button');
            calBtn.innerText = "تنظیم دستی جهت (کالیبراسیون)";
            calBtn.className = "btn-primary";
            calBtn.style.background = "var(--ac2)";
            calBtn.onclick = () => {
                calibrationOffset = -currentHeading; 
                alert("جهت شمال تنظیم شد.");
            };
            document.querySelector('.card').appendChild(calBtn);
        }

        function handleOrientation(event) {
            const lettersGroup = document.getElementById('letters-group');
            const dashedLine = document.getElementById('dashed-line');
            const kabaIcon = document.getElementById('kaba-icon');
            
            if (!lettersGroup || !dashedLine || !kabaIcon) return;

            let heading = event.webkitCompassHeading;
            if (heading === undefined || heading === null) {
                if (event.alpha !== null) heading = 360 - event.alpha;
                else return;
            }

            currentHeading = heading + calibrationOffset;
            lettersGroup.style.transform = `rotate(${-currentHeading}deg)`;
            
            const qiblaRotation = qiblaAngle - currentHeading - 90;
            dashedLine.style.transform = `rotate(${qiblaRotation}deg)`;
            kabaIcon.style.transform = `rotate(${qiblaRotation}deg)`;
        }

        function stopCompass() {
            window.removeEventListener('deviceorientationabsolute', handleOrientation);
            window.removeEventListener('deviceorientation', handleOrientation);
            compassActive = false;
        }

        // ==================== منطق قرآن (با اصلاح بسم الله) ====================
        async function loadSurah(surahId) {
            const contentDiv = document.getElementById('quran-content');
            if (!surahId) { contentDiv.innerHTML = ''; return; }
            
            contentDiv.innerHTML = '<p style="text-align:center; color:var(--mu);">در حال بارگذاری...</p>';
            
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,fa.makarem`);
                const data = await response.json();
                
                if (data.code === 200) {
                    const arabicData = data.data[0];
                    const farsiData = data.data[1];
                    const bismillahText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
                    
                    let html = `<h3 style="text-align:center; color:var(--ac); margin-bottom:15px;">سوره ${arabicData.name}</h3>`;
                    
                    // نمایش بسم الله به صورت جداگانه (به جز سوره فاتحه و توبه)
                    if (surahId != 1 && surahId != 9) {
                        html += `<div class="bismillah">${bismillahText}</div>`;
                    }

                    arabicData.ayahs.forEach((ayah, index) => {
                        let ayahText = ayah.text;
                        let farsiText = farsiData.ayahs[index] ? farsiData.ayahs[index].text : '';
                        
                        // حذف بسم الله از ابتدای آیه اول (چون جدا نوشتیم)
                        if (surahId != 1 && surahId != 9 && index === 0) {
                            ayahText = ayahText.replace(bismillahText, "").trim();
                        }
                        
                        html += `
                            <div class="ayah-box">
                                <div style="text-align:center;">
                                    <span class="ayah-number">${ayah.numberInSurah}</span>
                                </div>
                                <div class="ayah-arabic">${ayahText}</div>
                                <div class="ayah-farsi">${farsiText}</div>
                            </div>
                        `;
                    });
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="text-align:center; color:red;">خطا در بارگذاری سوره.</p>';
                }
            } catch (error) {
                contentDiv.innerHTML = '<p style="text-align:center; color:red;">اتصال به اینترنت برقرار نیست.</p>';
            }
        }
    </script>
</body>
</html>
