<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6f50">
    <link rel="manifest" href="manifest.webmanifest">
    <title>تبلیغ جماعت</title>
    <style>
        :root { --bg: #f6f4ef; --card: #fff; --tx: #1c2a24; --mu: #66756d; --ac: #1f6f50; --ac2: #e3f1ea; --bd: #e2ded4; --wa: #a4490a; }
        * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--tx); padding: 16px; }
        main { max-width: 640px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
        button { font: inherit; border: 0; border-radius: 10px; padding: 12px; background: var(--ac); color: white; cursor: pointer; width: 100%; margin-top: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; text-align: center; font-size: 18px; cursor: pointer; }
        .tile b { display: block; font-size: 30px; margin-bottom: 8px; }
        #content { margin-top: 16px; }
        .hidden { display: none; }
        
        /* استایل‌های آداب */
        .adab-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .adab-item { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .adab-item b { font-size: 20px; }
        .adab-text { text-align: right; line-height: 2; font-size: 16px; }
        .adab-text .ar { font-family: 'Amiri', serif; font-size: 22px; color: var(--ac); margin: 10px 0; display: block; border-right: 3px solid var(--ac); padding-right: 10px; }

        /* استایل‌های قبله‌نما */
        .compass { width: 200px; height: 200px; border: 4px solid var(--ac); border-radius: 50%; margin: 20px auto; position: relative; display: flex; align-items: center; justify-content: center; font-size: 60px; transition: transform 0.1s linear; }
        
        /* استایل‌های قرآن */
        .quran-select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--bd); margin-bottom: 10px; font-family: inherit; }
        .ayah { font-family: 'Amiri', serif; font-size: 24px; text-align: center; line-height: 2; margin: 10px 0; border-bottom: 1px dashed var(--bd); padding-bottom: 10px; }
    </style>
</head>
<body>
    <main>
        <h1>تبلیغ جماعت</h1>
        <p style="color:var(--mu); margin-bottom: 24px;">هماهنگی گروه‌های خروج</p>

        <div id="main-menu" class="grid">
            <div class="tile" onclick="show('tasbih')"><b>📿</b> تسبیح‌شمار</div>
            <div class="tile" onclick="show('qibla')"><b>🧭</b> قبله‌نما</div>
            <div class="tile" onclick="show('adab')"><b>📖</b> آداب و اذکار</div>
            <div class="tile" onclick="show('quran')"><b>📚</b> قرآن</div>
        </div>

        <div id="content"></div>
    </main>

    <script>
        // --- داده‌های آداب (خلاصه شده برای حجم کمتر) ---
        const ADAB_DATA = [
            { title: "آداب وضو", icon: "💧", items: ["نیت وضو را به دل بگیرید و «بسم الله» بگویید.", "دو دست را تا مچ بشویید و مسواک بزنید.", "سه بار مضمضه (آب در دهان) و استنشاق (آب در بینی) انجام دهید.", "صورت را بشویید: از جای رویش موی سر تا زیر چانه و از این گوش تا آن گوش (فرض).", "دست‌ها را تا آرنج بشویید (فرض).", "سر را مسح کنید و گوش‌ها را مسح کنید.", "پاها را تا مچ بشویید (فرض).", "در مصرف آب اسراف نکنید."] },
            { title: "آداب نماز", icon: "🤲", items: ["پیش از اذان آماده شوید: وضو، لباس پاک و مناسب.", "با آرامش و وقار به مسجد بروید.", "پس از سلام، سه بار استغفار کنید و تسبیحات حضرت زهرا (س) را بگویید.", "با خشوع و حضور قلب نماز بخوانید."] },
            { title: "آداب مسجد", icon: "🕌", items: ["با پای راست وارد شوید و بگویید: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "با پای چپ خارج شوید و بگویید: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "صدا را پایین بیاورید؛ مسجد را پاکیزه نگه دارید.", "از جلوی نمازگزار نگذرید."] },
            { title: "اذکار بعد از نماز", icon: "📿", items: ["سه بار استغفار: أَسْتَغْفِرُ اللَّهَ", "آیةالکرسی را بخوانید.", "سبحان‌الله ۳۳ بار، الحمدلله ۳۳ بار و الله‌اکبر ۳۴ بار بگویید."] }
        ];

        // --- لیست سوره‌های قرآن (برای منوی کشویی) ---
        const SURAHS = [
            { id: 1, name: "الفاتحة" }, { id: 2, name: "البقرة" }, { id: 3, name: "آل عمران" }, { id: 4, name: "النساء" }, { id: 5, name: "المائدة" },
            { id: 18, name: "الكهف" }, { id: 36, name: "يس" }, { id: 55, name: "الرحمن" }, { id: 67, name: "الملك" }, { id: 112, name: "الإخلاص" }, { id: 113, name: "الفلق" }, { id: 114, name: "الناس" }
        ];

        function show(page) {
            const content = document.getElementById('content');
            const menu = document.getElementById('main-menu');
            menu.classList.add('hidden');

            if (page === 'tasbih') {
                content.innerHTML = `
                    <div class="card">
                        <h2>📿 تسبیح‌شمار</h2>
                        <div id="count" style="font-size: 80px; font-weight: bold; margin: 20px 0;">0</div>
                        <button onclick="increment()">شمارش</button>
                        <button style="background:var(--ac2); color:var(--ac)" onclick="reset()">صفر کردن</button>
                        <button style="background:var(--wa); color:white" onclick="back()">بازگشت</button>
                    </div>
                `;
            } 
            else if (page === 'qibla') {
                content.innerHTML = `
                    <div class="card">
                        <h2>🧭 قبله‌نما</h2>
                        <p>برای فعال شدن قطب‌نما، دکمه زیر را بزنید و گوشی را صاف نگه دارید.</p>
                        <div id="compass" class="compass">🕋</div>
                        <button onclick="startCompass()">فعال‌سازی قطب‌نما</button>
                        <button style="background:var(--wa); color:white" onclick="back()">بازگشت</button>
                    </div>
                `;
            } 
            else if (page === 'adab') {
                let html = `<div class="card" style="text-align:right;">
                    <h2 style="text-align:center;">📖 آداب و اذکار</h2>
                    <div class="adab-list">`;
                ADAB_DATA.forEach((item, index) => {
                    html += `<div class="adab-item" onclick="showAdabDetail(${index})"><b>${item.icon}</b> ${item.title}</div>`;
                });
                html += `</div><button style="background:var(--wa); color:white; margin-top:16px;" onclick="back()">بازگشت</button></div>`;
                content.innerHTML = html;
            } 
            else if (page === 'quran') {
                let options = SURAHS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                content.innerHTML = `
                    <div class="card">
                        <h2>📚 قرآن کریم</h2>
                        <select id="surah-select" class="quran-select" onchange="loadSurah(this.value)">
                            <option value="">-- یک سوره انتخاب کنید --</option>
                            ${options}
                        </select>
                        <div id="quran-content" style="text-align:right; margin-top:15px;"></div>
                        <button style="background:var(--wa); color:white; margin-top:16px;" onclick="back()">بازگشت</button>
                    </div>
                `;
            }
        }

        function showAdabDetail(index) {
            const item = ADAB_DATA[index];
            const content = document.getElementById('content');
            let html = `<div class="card" style="text-align:right;">
                <h2 style="text-align:center;">${item.icon} ${item.title}</h2>
                <div class="adab-text">`;
            item.items.forEach(txt => {
                if (txt.match(/[\u0600-\u06FF]/) && txt.length < 150 && txt.includes('اللَّه')) {
                    html += `<div class="ar">${txt}</div>`;
                } else {
                    html += `<p>${txt}</p>`;
                }
            });
            html += `</div>
                <button style="background:var(--wa); color:white; margin-top:16px;" onclick="show('adab')">بازگشت به لیست</button>
            </div>`;
            content.innerHTML = html;
        }

        // --- منطق تسبیح ---
        let count = 0;
        function increment() { count++; document.getElementById('count').innerText = count; }
        function reset() { count = 0; document.getElementById('count').innerText = 0; }
        function back() { document.getElementById('content').innerHTML = ''; document.getElementById('main-menu').classList.remove('hidden'); }

        // --- منطق قبله‌نما ---
        let compassActive = false;
        function startCompass() {
            if (compassActive) return;
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        compassActive = true;
                    } else {
                        alert('دسترسی به قطب‌نما داده نشد.');
                    }
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                compassActive = true;
            }
        }

        function handleOrientation(event) {
            const compass = document.getElementById('compass');
            if (!compass) return;
            
            let heading = event.webkitCompassHeading;
            if (heading === undefined || heading === null) {
                if (event.alpha !== null) heading = 360 - event.alpha;
                else return;
            }

            // زاویه تقریبی قبله برای ایران (حدود ۲۱۳ درجه)
            const qiblaAngle = 213;
            const rotation = qiblaAngle - heading;

            compass.style.transform = `rotate(${rotation}deg)`;
        }

        // --- منطق قرآن (اتصال به API) ---
        async function loadSurah(surahId) {
            const contentDiv = document.getElementById('quran-content');
            if (!surahId) { contentDiv.innerHTML = ''; return; }
            
            contentDiv.innerHTML = '<p style="text-align:center; color:var(--mu);">در حال بارگذاری...</p>';
            
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/quran-uthmani`);
                const data = await response.json();
                
                if (data.code === 200) {
                    let html = `<h3 style="text-align:center; color:var(--ac);">سوره ${data.data.name}</h3>`;
                    data.data.ayahs.forEach(ayah => {
                        html += `<div class="ayah">${ayah.text}</div>`;
                    });
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="text-align:center; color:red;">خطا در بارگذاری سوره.</p>';
                }
            } catch (error) {
                contentDiv.innerHTML = '<p style="text-align:center; color:red;">اتصال به اینترنت برقرار نیست.</p>';
            }
        }
    </script>
</body>
</html>
