<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6f50">
    <link rel="manifest" href="manifest.webmanifest">
    <title>تبلیغ جماعت</title>
    <style>
        :root { --bg: #f6f4ef; --card: #fff; --tx: #1c2a24; --mu: #66756d; --ac: #1f6f50; --ac2: #e3f1ea; --bd: #e2ded4; }
        * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--tx); padding: 16px; }
        main { max-width: 640px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
        button { font: inherit; border: 0; border-radius: 10px; padding: 12px; background: var(--ac); color: white; cursor: pointer; width: 100%; margin-top: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; text-align: center; font-size: 18px; cursor: pointer; }
        .tile b { display: block; font-size: 30px; margin-bottom: 8px; }
        #content { margin-top: 16px; }
        .hidden { display: none; }
        
        /* استایل‌های بخش آداب */
        .adab-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .adab-item { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .adab-item:hover { background: var(--ac2); }
        .adab-item b { font-size: 20px; }
        .adab-text { text-align: right; line-height: 2; font-size: 16px; }
        .adab-text .ar { font-family: 'Amiri', serif; font-size: 22px; color: var(--ac); margin: 10px 0; display: block; border-right: 3px solid var(--ac); padding-right: 10px; }
    </style>
</head>
<body>
    <main>
        <h1 id="app-title">تبلیغ جماعت</h1>
        <p style="color:var(--mu); margin-bottom: 24px;">هماهنگی گروه‌های خروج</p>

        <div id="main-menu" class="grid">
            <div class="tile" onclick="show('tasbih')"><b>📿</b> تسبیح‌شمار</div>
            <div class="tile" onclick="show('qibla')"><b>🧭</b> قبله‌نما</div>
            <div class="tile" onclick="show('adab')"><b>📖</b> آداب و اذکار</div>
            <div class="tile" onclick="show('quran')"><b>📚</b> قرآن</div>
        </div>

        <div id="content">
            <!-- محتوا اینجا لود می‌شه -->
        </div>
    </main>

    <script>
        // --- داده‌های آداب (برگرفته از فایل شما) ---
        const ADAB_DATA = [
            { title: "آداب وضو", icon: "💧", items: ["نیت وضو را به دل بگیرید و «بسم الله» بگویید.", "دو دست را تا مچ بشویید و مسواک بزنید.", "سه بار مضمضه (آب در دهان) و استنشاق (آب در بینی) انجام دهید.", "صورت را بشویید: از جای رویش موی سر تا زیر چانه و از این گوش تا آن گوش (فرض).", "دست‌ها را تا آرنج، همراه با خود آرنج بشویید (فرض)؛ ابتدا دست راست.", "سر را مسح کنید (مقدار فرض یک‌چهارم سر است؛ مسح تمام سر سنت است) و گوش‌ها را مسح کنید.", "پاها را تا مچ، همراه با دو برآمدگی مچ بشویید (فرض)؛ ابتدا پای راست؛ انگشتان را خلال کنید.", "اعضا را پشت‌سرهم و به ترتیب بشویید؛ شستن سه‌باره سنت است.", "در مصرف آب اسراف نکنید، حتی کنار آب جاری.", "پس از وضو بگویید: أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ"] },
            { title: "آداب غسل", icon: "🚿", items: ["غسل پس از جنابت واجب است و برای بانوان پس از پایان حیض و نفاس؛ غسل جمعه، دو عید و احرام مستحب یا سنت است.", "نیت را به دل بگیرید و «بسم الله» بگویید.", "ابتدا دو دست را تا مچ بشویید و جاهای نجاست و شرم‌گاه را پاک کنید.", "وضو بگیرید؛ اگر جایی هستید که آب جمع می‌شود، شستن پاها را به پایان غسل بیندازید.", "سه بار آب بر سر بریزید و مطمئن شوید به ریشه موها و پوست رسیده است.", "سپس شانه راست و بعد شانه چپ را بشویید و سراسر بدن را آب بدهید.", "سه فرض غسل (حنفی): مضمضه (رسیدن آب به همه دهان)، استنشاق (رسیدن آب تا نرمه بینی) و شستن تمام بدن.", "مراقب باشید به هیچ نقطه‌ای آب نرسیده نماند: زیر ناخن، ناف، پشت گوش، لای انگشتان و موها؛ انگشتر و حلقه را حرکت دهید.", "با پوشش و دور از چشم دیگران غسل کنید و در مصرف آب اسراف نکنید، ولی کامل بشویید."] },
            { title: "آداب نماز", icon: "🤲", items: ["پیش از اذان آماده شوید: وضو، لباس پاک و مناسب، و در صورت امکان بوی خوش.", "با آرامش و وقار به مسجد بروید و ندوید.", "به اذان گوش دهید و پاسخ بدهید؛ دعا میان اذان و اقامه مستجاب است.", "پیش از نشستن، دو رکعت تحیة‌المسجد بخوانید (مستحب).", "صف‌ها را مستقیم و فشرده ببندید و جای خالی را پر کنید؛ صف اول فضیلت دارد.", "با خشوع و حضور قلب نماز بخوانید؛ رکوع و سجده را با آرامش انجام دهید.", "پس از سلام، سه بار استغفار کنید و طبق روایات مشهور: سبحان‌الله ۳۳ بار، الحمدلله ۳۳ بار و الله‌اکبر ۳۴ بار بگویید و دعا کنید."] },
            { title: "آداب مسجد", icon: "🕌", items: ["با پای راست وارد شوید و بگویید: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "هنگام ورود نیت اعتکاف (نفل) کنید تا از ثواب آن بهره ببرید.", "با پای چپ خارج شوید و بگویید: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "صدا را پایین بیاورید؛ دعوا و خرید و فروش در مسجد نکنید.", "مسجد را پاکیزه نگه دارید؛ کفش را در جای مخصوص بگذارید و آن را آلوده نکنید.", "از جلوی نمازگزار نگذرید."] },
            { title: "آداب غذا", icon: "🍽", items: ["دست‌ها را بشویید و «بسم الله» بگویید.", "با دست راست و از جلوی خود بخورید؛ از وسط ظرف نخورید.", "لقمه کوچک بگیرید و خوب بجوید؛ به غذا عیب نگیرید.", "کم بخورید و اسراف نکنید؛ لقمه افتاده را تمیز کنید و بخورید.", "پیش از رفتن به مسجد پیاز و سیر خام نخورید، یا دهان را خوب بشویید.", "پس از غذا بگویید: الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ"] },
            { title: "آداب خواب", icon: "🌙", items: ["با وضو و پس از مسواک بخوابید.", "روی پهلوی راست بخوابید.", "آیةالکرسی و سه سوره اخلاص، فلق و ناس را بخوانید.", "سبحان‌الله ۳۳، الحمدلله ۳۳ و الله‌اکبر ۳۴ بار بگویید.", "هنگام خواب: بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "هنگام بیدار شدن: الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ"] },
            { title: "اذکار بعد از نماز", icon: "📿", items: ["سه بار استغفار: أَسْتَغْفِرُ اللَّهَ", "سپس: اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", "آیةالکرسی (آیه ۲۵۵ سوره بقره) را بخوانید.", "سبحان‌الله ۳۳ بار، الحمدلله ۳۳ بار و الله‌اکبر ۳۴ بار بگویید.", "و برای تکمیل صد: لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ"] }
        ];

        function show(page) {
            const content = document.getElementById('content');
            const menu = document.getElementById('main-menu');
            menu.classList.add('hidden');

            if (page === 'tasbih') {
                content.innerHTML = `
                    <div class="card">
                        <h2>📿 تسبیح‌شمار</h2>
                        <div id="count" style="font-size: 80px; font-weight: bold; margin: 20px 0;">0</div>
                        <button onclick="increment()">شمارش</button>
                        <button style="background:var(--ac2); color:var(--ac)" onclick="reset()">صفر کردن</button>
                        <button style="background:#a4490a; color:white" onclick="back()">بازگشت</button>
                    </div>
                `;
            } else if (page === 'qibla') {
                content.innerHTML = `
                    <div class="card">
                        <h2>🧭 قبله‌نما</h2>
                        <p>زاویه قبله از شمال: ۲۱۳ درجه</p>
                        <div style="font-size: 60px; margin: 20px 0;">🕋</div>
                        <p style="color:var(--mu); font-size: 14px;">(برای عملکرد دقیق، این قابلیت در نسخه اصلی نیاز به تنظیمات گوشی دارد)</p>
                        <button style="background:#a4490a; color:white" onclick="back()">بازگشت</button>
                    </div>
                `;
            } else if (page === 'adab') {
                let html = `<div class="card" style="text-align:right;">
                    <h2 style="text-align:center;">📖 آداب و اذکار</h2>
                    <p style="color:var(--mu); font-size:14px; text-align:center;">برای مطالعه، یک مورد را انتخاب کنید</p>
                    <div class="adab-list">`;
                ADAB_DATA.forEach((item, index) => {
                    html += `<div class="adab-item" onclick="showAdabDetail(${index})"><b>${item.icon}</b> ${item.title}</div>`;
                });
                html += `</div><button style="background:#a4490a; color:white; margin-top:16px;" onclick="back()">بازگشت</button></div>`;
                content.innerHTML = html;
            } else if (page === 'quran') {
                content.innerHTML = `
                    <div class="card">
                        <h2>📚 قرآن کریم</h2>
                        <p>متن کامل قرآن و ترجمه در این بخش قرار می‌گیرد.</p>
                        <button style="background:#a4490a; color:white" onclick="back()">بازگشت</button>
                    </div>
                `;
            }
        }

        function showAdabDetail(index) {
            const item = ADAB_DATA[index];
            const content = document.getElementById('content');
            let html = `<div class="card" style="text-align:right;">
                <h2 style="text-align:center;">${item.icon} ${item.title}</h2>
                <div class="adab-text">`;
            item.items.forEach(txt => {
                // اگر متن عربی بود، با فونت و استایل خاص نشون بده
                if (txt.match(/[\u0600-\u06FF]/) && txt.length < 150 && txt.includes('اللَّه')) {
                    html += `<div class="ar">${txt}</div>`;
                } else {
                    html += `<p>${txt}</p>`;
                }
            });
            html += `</div>
                <button style="background:#a4490a; color:white; margin-top:16px;" onclick="show('adab')">بازگشت به لیست</button>
                <button style="background:var(--ac2); color:var(--ac); margin-top:8px;" onclick="back()">بازگشت به منو</button>
            </div>`;
            content.innerHTML = html;
        }

        let count = 0;
        function increment() {
            count++;
            document.getElementById('count').innerText = count;
        }
        function reset() {
            count = 0;
            document.getElementById('count').innerText = 0;
        }
        function back() {
            document.getElementById('content').innerHTML = '';
            document.getElementById('main-menu').classList.remove('hidden');
        }
    </script>
</body>
</html>
