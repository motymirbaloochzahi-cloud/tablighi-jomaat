<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6f50">
    <link rel="manifest" href="manifest.webmanifest">
    <title>تبلیغ جماعت</title>
    <style>
        :root { --bg: #f6f4ef; --card: #fff; --tx: #1c2a24; --mu: #66756d; --ac: #1f6f50; --ac2: #e3f1ea; --bd: #e2ded4; --wa: #a4490a; --red: #e74c3c; }
        * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--tx); padding: 16px; }
        main { max-width: 640px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
        button { font: inherit; border: 0; border-radius: 10px; padding: 12px; background: var(--ac); color: white; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-gray { background: var(--ac2); color: var(--ac); }
        .btn-red { background: var(--wa); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; text-align: center; font-size: 18px; cursor: pointer; }
        .tile b { display: block; font-size: 30px; margin-bottom: 8px; }
        #content { margin-top: 16px; }
        .hidden { display: none; }
        
        /* استایل‌های آداب */
        .adab-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .adab-item { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .adab-item:hover { background: var(--ac2); }
        .adab-text { text-align: right; line-height: 2; font-size: 16px; }
        .adab-text .ar { font-family: 'Amiri', serif; font-size: 22px; color: var(--ac); margin: 10px 0; display: block; border-right: 3px solid var(--ac); padding-right: 10px; }

        /* ====== استایل‌های قطب‌نما ====== */
        .compass-wrapper { position: relative; width: 320px; height: 320px; margin: 30px auto; }
        
        /* دایره داخلی */
        .compass-disc {
            position: absolute;
            top: 40px; left: 40px; right: 40px; bottom: 40px;
            border-radius: 50%;
            border: 3px solid var(--ac);
            background: #fff;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.1);
        }

        /* گروه چرخان حروف */
        .letters-group {
            position: absolute;
            inset: -40px; /* برای پوشش حروف بیرونی */
            transition: transform 0.1s linear;
            border-radius: 50%;
        }

        /* نقطه مرکزی */
        .center-dot {
            position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; background: var(--tx);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 5;
        }

        /* خط نقطه‌چین */
        .dashed-line {
            position: absolute; top: 50%; left: 50%;
            width: 120px; height: 4px;
            background-image: linear-gradient(to right, var(--ac) 50%, transparent 50%);
            background-size: 10px 4px; background-repeat: repeat-x;
            transform-origin: left center; margin-top: -2px;
            z-index: 2; transition: transform 0.1s linear;
        }

        /* آیکون کعبه */
        .kaba-icon {
            position: absolute; top: 50%; left: 50%;
            width: 44px; height: 44px; margin-top: -22px; margin-left: 98px;
            background: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; z-index: 4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transform-origin: -98px center; /* چرخش به دور مرکز */
            transition: transform 0.1s linear;
        }

        /* حروف جهات */
        .dir-letter { position: absolute; font-size: 24px; font-weight: bold; color: var(--tx); width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; z-index: 3; }
        .letter-n { top: 0px; left: 50%; transform: translateX(-50%); color: var(--red); }
        .letter-s { bottom: 0px; left: 50%; transform: translateX(-50%); }
        .letter-e { right: 0px; top: 50%; transform: translateY(-50%); }
        .letter-w { left: 0px; top: 50%; transform: translateY(-50%); }

        .status-box { background: var(--ac2); color: var(--ac); padding: 8px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
    </style>
</head>

                <div class="adab-text">`;
            item.items.forEach(txt => {
                if (txt.match(/[\u0600-\u06FF]/) && txt.length < 150 && txt.includes('اللَّه')) {
                    html += `<div class="ar">${txt}</div>`;
                } else {
                    html += `<p>${txt}</p>`;
                }
            });
            html += `</div><button class="btn-red" style="margin-top:16px;" onclick="show('adab')">بازگشت به لیست</button></div>`;
            document.getElementById('content').innerHTML = html;
        }

        let count = 0;
        function increment() { count++; document.getElementById('count').innerText = count; }
        function reset() { count = 0; document.getElementById('count').innerText = 0; }
        function back() { document.getElementById('content').innerHTML = ''; document.getElementById('main-menu').classList.remove('hidden'); }

        // ==================== منطق قطب‌نما (دقیق) ====================
        let qiblaAngle = 0; 
        let currentHeading = 0;
        let calibrationOffset = 0;
        let compassActive = false;

        function calculateQibla(lat, lng) {
            const K_LAT = 21.4225, K_LNG = 39.8262;
            const phi1 = lat * Math.PI / 180, phi2 = K_LAT * Math.PI / 180;
            const deltaLambda = (K_LNG - lng) * Math.PI / 180;
            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function startCompass() {
            const status = document.getElementById('status-box');
            status.innerText = "در حال دریافت موقعیت...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        qiblaAngle = calculateQibla(pos.coords.latitude, pos.coords.longitude);
                        status.innerText = `موقعیت دریافت شد. زاویه قبله: ${Math.round(qiblaAngle)}°`;
                        initDeviceOrientation();
                    },
                    (err) => {
                        status.innerText = "خطا در دریافت موقعیت. GPS را روشن کنید.";
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function initDeviceOrientation() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permission => {
                    if (permission === 'granted') setupOrientationListener();
                });
            } else {
                setupOrientationListener();
            }
        }

        function setupOrientationListener() {
            if (compassActive) return;
            window.addEventListener('deviceorientationabsolute', handleOrientation);
            window.addEventListener('deviceorientation', handleOrientation);
            compassActive = true;
            
            const calBtn = document.createElement('button');
            calBtn.innerText = "تنظیم دستی جهت (کالیبراسیون)";
            calBtn.className = "btn-gray";
            calBtn.style.marginTop = "8px";
            calBtn.onclick = () => {
                calibrationOffset = -currentHeading; 
                alert("جهت شمال تنظیم شد.");
            };
            document.querySelector('.card').appendChild(calBtn);
        }

        function handleOrientation(event) {
            const lettersGroup = document.getElementById('letters-group');
            const dashedLine = document.getElementById('dashed-line');
            const kabaIcon = document.getElementById('kaba-icon');
            
            if (!lettersGroup || !dashedLine || !kabaIcon) return;

            let heading = event.webkitCompassHeading;
            if (heading === undefined || heading === null) {
                if (event.alpha !== null) heading = 360 - event.alpha;
                else return;
            }

            currentHeading = heading + calibrationOffset;
            
            // ۱. چرخش حروف جهات (N,S,E,W) برای نشان دادن شمال واقعی
            lettersGroup.style.transform = `rotate(${-currentHeading}deg)`;
            
            // ۲. چرخش خط نقطه‌چین و کعبه برای نشان دادن جهت قبله
            // زاویه قبله نسبت به شمال است. چون گوشی چرخیده، باید نسبت به جهت فعلی تنظیم شود.
            const qiblaRotation = qiblaAngle - currentHeading;
            
            dashedLine.style.transform = `rotate(${qiblaRotation}deg)`;
            kabaIcon.style.transform = `rotate(${qiblaRotation}deg)`;
        }

        function stopCompass() {
            window.removeEventListener('deviceorientationabsolute', handleOrientation);
            window.removeEventListener('deviceorientation', handleOrientation);
            compassActive = false;
        }

        // ==================== منطق قرآن (کامل با شماره آیه و ترجمه) ====================
        async function loadSurah(surahId) {
            const contentDiv = document.getElementById('quran-content');
            if (!surahId) { contentDiv.innerHTML = ''; return; }
            
            contentDiv.innerHTML = '<p style="text-align:center; color:var(--mu);">در حال بارگذاری متن و ترجمه...</p>';
            
            try {
                // دریافت متن عربی و ترجمه فارسی به صورت همزمان
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,fa.makarem`);
                const data = await response.json();
                
                if (data.code === 200) {
                    const arabicData = data.data[0];
                    const farsiData = data.data[1];
                    
                    let html = `<h3 style="text-align:center; color:var(--ac); margin-bottom:15px;">سوره ${arabicData.name}</h3>`;
                    
                    arabicData.ayahs.forEach((ayah, index) => {
                        const farsiText = farsiData.ayahs[index] ? farsiData.ayahs[index].text : '';
                        
                        html += `
                            <div style="border-bottom: 1px dashed var(--bd); padding-bottom: 12px; margin-bottom: 12px;">
                                <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px;">
                                    <span style="background:var(--ac2); color:var(--ac); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold;">${ayah.numberInSurah}</span>
                                </div>
                                <div style="font-family:'Amiri',serif; font-size:24px; text-align:center; line-height:2; margin-bottom:8px;">${ayah.text}</div>
                                <div style="font-size:15px; color:var(--mu); text-align:center; line-height:1.8;">${farsiText}</div>
                            </div>
                        `;
                    });
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="text-align:center; color:red;">خطا در بارگذاری سوره.</p>';
                }
            } catch (error) {
                contentDiv.innerHTML = '<p style="text-align:center; color:red;">اتصال به اینترنت برقرار نیست.</p>';
            }
        }
    </script>
</body>
</html>
    <style>
        :root { --bg: #f6f4ef; --card: #fff; --tx: #1c2a24; --mu: #66756d; --ac: #1f6f50; --ac2: #e3f1ea; --bd: #e2ded4; --wa: #a4490a; --red: #e74c3c; }
        * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--tx); padding: 16px; }
        main { max-width: 640px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
        button { font: inherit; border: 0; border-radius: 10px; padding: 12px; background: var(--ac); color: white; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-gray { background: var(--ac2); color: var(--ac); }
        .btn-red { background: var(--wa); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; text-align: center; font-size: 18px; cursor: pointer; }
        .tile b { display: block; font-size: 30px; margin-bottom: 8px; }
        #content { margin-top: 16px; }
        .hidden { display: none; }
        
        /* استایل‌های آداب */
        .adab-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .adab-item { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .adab-text { text-align: right; line-height: 2; font-size: 16px; }

        /* ====== استایل‌های قطب‌نما ====== */
        .compass-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
        }

        /* دایره داخلی که می‌چرخد */
        .compass-disc {
            position: absolute;
            top: 40px; left: 40px; right: 40px; bottom: 40px; /* 40px فاصله برای حروف */
            border-radius: 50%;
            border: 3px solid var(--ac);
            background: #fff;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.1);
            /* transition حذف شد تا حرکت نرم و بدون تاخیر باشه */
        }

        /* گروه چرخان (شامل همه چیز) */
        .rotating-group {
            position: absolute;
            inset: -40px; /* کشیده میشه تا حروف بیرون رو هم بگیره */
            transition: transform 0.1s linear;
            border-radius: 50%;
        }

        /* خط نقطه‌چین از مرکز به سمت لبه */
        .dashed-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px; 
            height: 4px;
            background-image: linear-gradient(to right, var(--ac) 50%, transparent 50%);
            background-size: 10px 4px;
            background-repeat: repeat-x;
            transform-origin: left center;
            margin-top: -2px; 
            z-index: 1;
        }

        /* آیکون کعبه روی لبه دایره */
        .kaba-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: 100px; /* 120px (نصف قطر) - 20px */
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transform-origin: -100px center; /* چرخش دور مرکز */
        }

        /* نقطه مرکزی */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: var(--tx);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* حروف جهات که حالا با دایره می‌چرخن */
        .dir-letter {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: var(--tx);
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4;
        }
        /* موقعیت حروف بیرون از دایره (فاصله 40px از لبه دایره) */
        .letter-n { top: 0px; left: 50%; transform: translateX(-50%); color: var(--red); }
        .letter-s { bottom: 0px; left: 50%; transform: translateX(-50%); }
        .letter-e { right: 0px; top: 50%; transform: translateY(-50%); }
        .letter-w { left: 0px; top: 50%; transform: translateY(-50%); }

        .status-box { background: var(--ac2); color: var(--ac); padding: 8px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>تبلیغ جماعت</h1>
        <p style="color:var(--mu); margin-bottom: 24px;">هماهنگی گروه‌های خروج</p>

        <div id="main-menu" class="grid">
            <div class="tile" onclick="show('tasbih')"><b>📿</b> تسبیح‌شمار</div>
            <div class="tile" onclick="show('qibla')"><b>🧭</b> قبله‌نما</div>
            <div class="tile" onclick="show('adab')"><b>📖</b> آداب و اذکار</div>
            <div class="tile" onclick="show('quran')"><b>📚</b> قرآن</div>
        </div>

        <div id="content"></div>
    </main>

    <script>
        const ADAB_DATA = [
            { title: "آداب وضو", icon: "💧", items: ["نیت وضو را به دل بگیرید و «بسم الله» بگویید.", "دو دست را تا مچ بشویید و مسواک بزنید.", "سه بار مضمضه و استنشاق انجام دهید.", "صورت را بشویید (فرض).", "دست‌ها را تا آرنج بشویید (فرض).", "سر و گوش‌ها را مسح کنید.", "پاها را تا مچ بشویید (فرض)."] }
        ];
        const SURAHS = [{ id: 1, name: "الفاتحة" }, { id: 36, name: "يس" }];

        function show(page) {
            const content = document.getElementById('content');
            document.getElementById('main-menu').classList.add('hidden');

            if (page === 'tasbih') {
                content.innerHTML = `
                    <div class="card">
                        <h2>📿 تسبیح‌شمار</h2>
                        <div id="count" style="font-size: 80px; font-weight: bold; margin: 20px 0;">0</div>
                        <button onclick="increment()">شمارش</button>
                        <button class="btn-gray" onclick="reset()">صفر کردن</button>
                        <button class="btn-red" onclick="back()">بازگشت</button>
                    </div>`;
            } 
            else if (page === 'qibla') {
                content.innerHTML = `
                    <div class="card">
                        <h2>🧭 قبله‌نما</h2>
                        
                        <div class="compass-wrapper">
                            <!-- دایره که شامل گروه چرخان است -->
                            <div class="compass-disc">
                                <!-- گروه چرخان (خط چین، کعبه و حروف) -->
                                <div id="rotating-group" class="rotating-group">
                                    <div class="dashed-line"></div>
                                    <div class="kaba-icon">🕋</div>
                                    
                                    <!-- حروف جهات که حالا با دایره می‌چرخن -->
                                    <div class="dir-letter letter-n">N</div>
                                    <div class="dir-letter letter-s">S</div>
                                    <div class="dir-letter letter-e">E</div>
                                    <div class="dir-letter letter-w">W</div>
                                </div>
                                <div class="center-dot"></div>
                            </div>
                        </div>
                        
                        <div id="status-box" class="status-box">در حال آماده‌سازی...</div>
                        
                        <button onclick="startCompass()">شروع / کالیبراسیون</button>
                        <button class="btn-red" onclick="stopCompass(); back()">توقف و بازگشت</button>
                    </div>
                `;
            } 
            else if (page === 'adab') {
                let html = `<div class="card" style="text-align:right;"><h2 style="text-align:center;">📖 آداب</h2><div class="adab-list">`;
                ADAB_DATA.forEach((item, index) => {
                    html += `<div class="adab-item" onclick="showAdabDetail(${index})"><b>${item.icon}</b> ${item.title}</div>`;
                });
                html += `</div><button class="btn-red" style="margin-top:16px;" onclick="back()">بازگشت</button></div>`;
                content.innerHTML = html;
            } 
            else if (page === 'quran') {
                let options = SURAHS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                content.innerHTML = `
                    <div class="card">
                        <h2>📚 قرآن کریم</h2>
                        <select id="surah-select" onchange="loadSurah(this.value)" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--bd);">
                            <option value="">-- انتخاب سوره --</option>${options}
                        </select>
                        <div id="quran-content" style="text-align:right; margin-top:15px;"></div>
                        <button class="btn-red" style="margin-top:16px;" onclick="back()">بازگشت</button>
                    </div>`;
            }
        }

        function showAdabDetail(index) {
            const item = ADAB_DATA[index];
            let html = `<div class="card" style="text-align:right;"><h2 style="text-align:center;">${item.icon} ${item.title}</h2><div class="adab-text">`;
            item.items.forEach(txt => { html += `<p>${txt}</p>`; });
            html += `</div><button class="btn-red" style="margin-top:16px;" onclick="show('adab')">بازگشت</button></div>`;
            document.getElementById('content').innerHTML = html;
        }

        let count = 0;
        function increment() { count++; document.getElementById('count').innerText = count; }
        function reset() { count = 0; document.getElementById('count').innerText = 0; }
        function back() { document.getElementById('content').innerHTML = ''; document.getElementById('main-menu').classList.remove('hidden'); }

        // ==================== منطق قطب‌نما ====================
        let qiblaAngle = 0; 
        let currentHeading = 0;
        let calibrationOffset = 0;
        let compassActive = false;

        function calculateQibla(lat, lng) {
            const K_LAT = 21.4225, K_LNG = 39.8262;
            const phi1 = lat * Math.PI / 180, phi2 = K_LAT * Math.PI / 180;
            const deltaLambda = (K_LNG - lng) * Math.PI / 180;
            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function startCompass() {
            const status = document.getElementById('status-box');
            status.innerText = "در حال دریافت موقعیت...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        qiblaAngle = calculateQibla(pos.coords.latitude, pos.coords.longitude);
                        status.innerText = `موقعیت دریافت شد. زاویه قبله: ${Math.round(qiblaAngle)}°`;
                        initDeviceOrientation();
                    },
                    (err) => {
                        status.innerText = "خطا در دریافت موقعیت. GPS را روشن کنید.";
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function initDeviceOrientation() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permission => {
                    if (permission === 'granted') setupOrientationListener();
                });
            } else {
                setupOrientationListener();
            }
        }

        function setupOrientationListener() {
            if (compassActive) return;
            window.addEventListener('deviceorientationabsolute', handleOrientation);
            window.addEventListener('deviceorientation', handleOrientation);
            compassActive = true;
            
            const calBtn = document.createElement('button');
            calBtn.innerText = "تنظیم دستی جهت (کالیبراسیون)";
            calBtn.className = "btn-gray";
            calBtn.style.marginTop = "8px";
            calBtn.onclick = () => {
                calibrationOffset = -currentHeading; 
                alert("جهت‌ها با شمال تنظیم شد.");
            };
            document.querySelector('.card').appendChild(calBtn);
        }

        function handleOrientation(event) {
            const rotatingGroup = document.getElementById('rotating-group');
            if (!rotatingGroup) return;

            let heading = event.webkitCompassHeading;
            if (heading === undefined || heading === null) {
                if (event.alpha !== null) heading = 360 - event.alpha;
                else return;
            }

            currentHeading = heading + calibrationOffset;
            
            // چرخش کل گروه (شامل حروف، خط چین و کعبه)
            // به جای اینکه کعبه رو جدا بچرخونیم، کل گروه رو با هم می‌چرخونیم
            rotatingGroup.style.transform = `rotate(${-currentHeading}deg)`;
            
            // حالا چون کعبه داخل گروهه، باید داخل خود گروه هم بچرخه
            const kaba = rotatingGroup.querySelector('.kaba-icon');
            const dashedLine = rotatingGroup.querySelector('.dashed-line');
            
            if (kaba && dashedLine) {
                // چرخش اضافی برای کعبه تا به سمت قبله اشاره کنه
                // چون کل گروه -currentHeading چرخیده، کعبه باید با زاویه qibla بچرخه
                const extraRotation = qiblaAngle;
                
                // چرخش دور مرکز
                kaba.style.transform = `rotate(${extraRotation}deg)`;
                dashedLine.style.transform = `rotate(${extraRotation}deg)`;
            }
        }

        function stopCompass() {
            window.removeEventListener('deviceorientationabsolute', handleOrientation);
            window.removeEventListener('deviceorientation', handleOrientation);
            compassActive = false;
        }

        // ==================== منطق قرآن ====================
        async function loadSurah(surahId) {
            const contentDiv = document.getElementById('quran-content');
            if (!surahId) return;
            contentDiv.innerHTML = '<p>در حال بارگذاری...</p>';
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/quran-uthmani`);
                const data = await response.json();
                let html = `<h3 style="text-align:center; color:var(--ac);">سوره ${data.data.name}</h3>`;
                data.data.ayahs.forEach(ayah => {
                    html += `<div style="font-family:'Amiri',serif; font-size:24px; text-align:center; margin:10px 0; border-bottom:1px dashed var(--bd); padding-bottom:10px;">${ayah.text}</div>`;
                });
                contentDiv.innerHTML = html;
            } catch (e) {
                contentDiv.innerHTML = '<p style="color:red;">خطا در اتصال.</p>';
            }
        }
    </script>
</body>
